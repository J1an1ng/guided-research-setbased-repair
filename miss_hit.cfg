project_root
enable: true
line_length: 150
suppress_rule: "copyright_notice"
suppress_rule: "operator_after_continuation"
regex_script_name: "[a-z]+(_([a-z]+|[0-9]+))*"
regex_class_name: "([A-Z]+|[A-Z][a-z]*)([A-Z]+|[A-Z][a-z]*|[0-9]+)*"
regex_function_name: "([a-z]+|[A-Z]+)[0-9]*((_|2)([0-9]([a-z]+|[A-Z]+)|([a-z]+|[A-Z]+)[0-9]*|[0-9]+))*"
regex_nested_name: "[a-z]+[0-9]*((_|2)([a-z]+[0-9]*|[0-9]+))*"
regex_method_name: "[a-z]+[0-9]*((_|2)([0-9][a-z]+|[a-z]+[0-9]*|[0-9]+))*"
regex_attribute_name: "([a-z]+|[A-Z]+)[0-9]*((_|2)([0-9]([a-z]+|[A-Z]+)|([a-z]+|[A-Z]+)[0-9]*|[0-9]+))*"
regex_parameter_name: "([A-Z]|[a-z])+[0-9]*(_([A-Z]|[a-z]+[0-9]*|[0-9]+))*"
align_round_brackets: false
